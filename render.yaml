services:
  - type: web
    name: clinic-booking-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Neon connection string
      - key: API_KEY
        sync: false
